name: Sync Adblock4limbo supplement

on:
  schedule:
    # GitHub cron uses UTC: 18:37 UTC = 02:37 Asia/Hong_Kong the next day.
    # The predictable month-end refresh is normally picked up 2h37m later.
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      retry_count:
        description: Internal automatic retry counter
        required: false
        type: number
        default: 0

permissions: {}

concurrency:
  group: sync-adblock4limbo
  cancel-in-progress: false

env:
  BASE_BRANCH: main

jobs:
  sync:
    if: github.repository == 'MaroonYS/surge-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Regenerate supplement and expanded rules
        run: |
          set -euo pipefail

          for attempt in 1 2 3
          do
            if python scripts/sync_adblock4limbo.py \
              --write \
              --timeout 30 \
              --metadata-json "$RUNNER_TEMP/adblock-source-metadata.json"
            then
              break
            fi

            if (( attempt == 3 ))
            then
              exit 1
            fi

            sleep $((attempt * 15))
          done

          python scripts/build_expanded.py --write

          {
            echo "### Adblock4limbo source provenance"
            python - "$RUNNER_TEMP/adblock-source-metadata.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              metadata = json.load(handle)
          for label, key in (
              ("Source", "source"),
              ("DOMAIN-SET baseline", "domain_set_baseline"),
              ("RULE-SET baseline", "rule_set_baseline"),
          ):
              item = metadata[key]
              print(f"- {label}: `{item['sha256']}` — {item['url']}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test and validate generated output
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python scripts/build_expanded.py --check
          python scripts/validate.py \
            --strict \
            --github-annotations \
            --json-out validation-report.json
          python scripts/check_module_compatibility.py
          python scripts/check_biliuniverse.py --timeout 30
          python scripts/check_upstreams.py --timeout 15 --retries 2
          git diff --check

      - name: Detect generated changes
        id: changes
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only)"
          unexpected_files="$(
            printf '%s\n' "$changed_files" \
              | grep -Ev \
                '^(adblock4limbo-supplement\.conf|surge-expanded\.conf)$' \
              || true
          )"

          if [[ -n "$unexpected_files" ]]
          then
            echo "::error::Generator changed files outside the allowlist."
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          if git diff --quiet -- \
            adblock4limbo-supplement.conf \
            surge-expanded.conf
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated files already match upstream." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- \
              adblock4limbo-supplement.conf \
              surge-expanded.conf
          fi

      - name: Commit and fast-forward main
        id: publish
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          base_sha="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            adblock4limbo-supplement.conf \
            surge-expanded.conf

          unexpected_staged="$(
            git diff --cached --name-only \
              | grep -Ev \
                '^(adblock4limbo-supplement\.conf|surge-expanded\.conf)$' \
              || true
          )"
          if [[ -n "$unexpected_staged" ]]
          then
            echo "::error::Unexpected staged files: $unexpected_staged"
            exit 1
          fi

          git commit -m "chore: refresh Adblock4limbo supplement"

          git fetch --no-tags origin "$BASE_BRANCH"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$base_sha" ]]
          then
            echo "::error::main moved during synchronization; refusing to publish."
            exit 1
          fi

          git push origin "HEAD:refs/heads/${BASE_BRANCH}"
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Published verified generated files to main." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the immutable published Raw files
        if: steps.changes.outputs.changed == 'true'
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5
          do
            if python scripts/check_upstreams.py \
              --local-only \
              --config-ref "$PUBLISHED_SHA" \
              --timeout 15 \
              --retries 2
            then
              echo "Published commit Raw smoke test passed." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Queue bounded automatic retry
        if: ${{ failure() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_COUNT: ${{ inputs.retry_count || 0 }}
        run: |
          set -euo pipefail

          if (( RETRY_COUNT >= 2 ))
          then
            echo "Automatic retry limit reached." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sleep 30
          gh workflow run sync-adblock4limbo.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BASE_BRANCH" \
            -f retry_count="$((RETRY_COUNT + 1))"
          echo "Queued automatic retry $((RETRY_COUNT + 1)) of 2." \
            >> "$GITHUB_STEP_SUMMARY"
