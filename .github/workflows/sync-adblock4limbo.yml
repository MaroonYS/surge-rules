name: Sync Adblock4limbo supplement

on:
  schedule:
    # GitHub schedules use UTC. Check every six hours away from the hour.
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-adblock4limbo
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  UPDATE_BRANCH: automation/adblock4limbo-sync

jobs:
  sync:
    if: github.repository == 'MaroonYS/surge-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate supplement and expanded rules
        run: |
          set -euo pipefail
          python scripts/sync_adblock4limbo.py --write --timeout 30
          python scripts/build_expanded.py --write

      - name: Test and validate generated output
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python scripts/build_expanded.py --check
          python scripts/validate.py \
            --strict \
            --github-annotations \
            --json-out validation-report.json
          git diff --check

      - name: Detect generated changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            adblock4limbo-supplement.conf \
            surge-expanded.conf
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated files already match upstream." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- \
              adblock4limbo-supplement.conf \
              surge-expanded.conf
          fi

      - name: Commit and update automation branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          remote_sha="$(
            git ls-remote --heads \
              origin "refs/heads/${UPDATE_BRANCH}" \
              | awk '{print $1}'
          )"

          git switch -C "${UPDATE_BRANCH}" "${BASE_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            adblock4limbo-supplement.conf \
            surge-expanded.conf
          git commit -m "chore: refresh Adblock4limbo supplement"

          if [[ -n "$remote_sha" ]]
          then
            git push \
              --force-with-lease="refs/heads/${UPDATE_BRANCH}:${remote_sha}" \
              origin "HEAD:refs/heads/${UPDATE_BRANCH}"
          else
            git push \
              --force-with-lease="refs/heads/${UPDATE_BRANCH}:" \
              origin "HEAD:refs/heads/${UPDATE_BRANCH}"
          fi

      - name: Open or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]
          then
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base "$BASE_BRANCH" \
                --head "$UPDATE_BRANCH" \
                --title "chore: refresh Adblock4limbo supplement" \
                --body-file .github/adblock-sync-pr.md \
                --draft
            )"
          else
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: refresh Adblock4limbo supplement" \
              --body-file .github/adblock-sync-pr.md

            pr_url="$(
              gh pr view "$pr_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json url \
                --jq '.url'
            )"
          fi

          echo "Updated pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
