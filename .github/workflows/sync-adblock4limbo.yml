name: Sync Adblock4limbo supplement

on:
  schedule:
    # GitHub cron uses UTC: 18:37 UTC = 02:37 Asia/Hong_Kong the next day.
    # The predictable month-end refresh is normally picked up 2h37m later.
    - cron: "37 18 * * *"
  workflow_dispatch:
    inputs:
      retry_count:
        description: Internal automatic retry counter
        required: false
        type: number
        default: 0

permissions: {}

concurrency:
  group: sync-adblock4limbo
  cancel-in-progress: false

env:
  BASE_BRANCH: main

jobs:
  sync:
    if: github.repository == 'MaroonYS/surge-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: write
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate supplement and expanded rules
        run: |
          set -euo pipefail

          for attempt in 1 2 3
          do
            if python scripts/sync_adblock4limbo.py --write --timeout 30
            then
              break
            fi

            if (( attempt == 3 ))
            then
              exit 1
            fi

            sleep $((attempt * 15))
          done

          python scripts/build_expanded.py --write

      - name: Test and validate generated output
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python scripts/build_expanded.py --check
          python scripts/validate.py \
            --strict \
            --github-annotations \
            --json-out validation-report.json
          git diff --check

      - name: Detect generated changes
        id: changes
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only)"
          unexpected_files="$(
            printf '%s\n' "$changed_files" \
              | grep -Ev \
                '^(adblock4limbo-supplement\.conf|surge-expanded\.conf)$' \
              || true
          )"

          if [[ -n "$unexpected_files" ]]
          then
            echo "::error::Generator changed files outside the allowlist."
            printf '%s\n' "$unexpected_files"
            exit 1
          fi

          if git diff --quiet -- \
            adblock4limbo-supplement.conf \
            surge-expanded.conf
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated files already match upstream." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- \
              adblock4limbo-supplement.conf \
              surge-expanded.conf
          fi

      - name: Commit and fast-forward main
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          base_sha="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            adblock4limbo-supplement.conf \
            surge-expanded.conf

          unexpected_staged="$(
            git diff --cached --name-only \
              | grep -Ev \
                '^(adblock4limbo-supplement\.conf|surge-expanded\.conf)$' \
              || true
          )"
          if [[ -n "$unexpected_staged" ]]
          then
            echo "::error::Unexpected staged files: $unexpected_staged"
            exit 1
          fi

          git commit -m "chore: refresh Adblock4limbo supplement"

          git fetch --no-tags origin "$BASE_BRANCH"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$base_sha" ]]
          then
            echo "::error::main moved during synchronization; refusing to publish."
            exit 1
          fi

          git push origin "HEAD:refs/heads/${BASE_BRANCH}"
          echo "Published verified generated files to main." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Queue bounded automatic retry
        if: ${{ failure() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_COUNT: ${{ inputs.retry_count || 0 }}
        run: |
          set -euo pipefail

          if (( RETRY_COUNT >= 2 ))
          then
            echo "Automatic retry limit reached." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sleep 30
          gh workflow run sync-adblock4limbo.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BASE_BRANCH" \
            -f retry_count="$((RETRY_COUNT + 1))"
          echo "Queued automatic retry $((RETRY_COUNT + 1)) of 2." \
            >> "$GITHUB_STEP_SUMMARY"
