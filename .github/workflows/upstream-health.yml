name: Check upstream rule availability

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check local files and external upstreams
        run: >
          python scripts/check_upstreams.py
          --timeout 15
          --retries 2

      - name: Check current commit Raw URLs
        run: >
          python scripts/check_upstreams.py
          --local-only
          --local-ref "$GITHUB_SHA"
          --timeout 15
          --retries 2

      - name: Check BiliUniverse Global compatibility
        run: >
          python scripts/check_biliuniverse.py
          --timeout 30

      - name: Check production main Raw URLs
        run: >
          python scripts/check_upstreams.py
          --local-only
          --config-ref main
          --timeout 15
          --retries 2

      - name: Check the Adblock4limbo supplement
        run: >
          python scripts/sync_adblock4limbo.py
          --check
          --timeout 30
