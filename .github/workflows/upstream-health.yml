name: Check upstream rule availability

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check all remote rule URLs
        run: >
          python scripts/check_upstreams.py
          --timeout 15
          --retries 2
          --fetch-local

      - name: Check the Adblock4limbo supplement
        run: >
          python scripts/sync_adblock4limbo.py
          --check
          --timeout 30
