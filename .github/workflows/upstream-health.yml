name: Check upstream rule availability

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check local files and external upstreams
        run: >
          python scripts/check_upstreams.py
          --timeout 15
          --retries 2

      - name: Check current commit Raw URLs
        run: >
          python scripts/check_upstreams.py
          --local-only
          --local-ref "$GITHUB_SHA"
          --timeout 15
          --retries 2

      - name: Check BiliUniverse Global compatibility
        run: >
          python scripts/check_biliuniverse.py
          --timeout 30

      - name: Check retained-module compatibility contract
        run: python scripts/check_module_compatibility.py

      - name: Check production main Raw URLs
        run: >
          python scripts/check_upstreams.py
          --local-only
          --config-ref main
          --timeout 15
          --retries 2

      - name: Check the Adblock4limbo supplement
        run: >
          python scripts/sync_adblock4limbo.py
          --check
          --timeout 30
