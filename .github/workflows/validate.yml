name: Validate Surge rules

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check expanded rule is current
        run: python scripts/build_expanded.py --check

      - name: Validate repository
        run: >
          python scripts/validate.py
          --strict
          --github-annotations
          --json-out validation-report.json

      - name: Check generated Adblock supplement
        run: >
          python scripts/sync_adblock4limbo.py
          --check
          --timeout 30

      - name: Check local files and external upstreams
        run: >
          python scripts/check_upstreams.py
          --timeout 15
          --retries 2

      - name: Check current commit Raw URLs
        run: >
          python scripts/check_upstreams.py
          --local-only
          --local-ref "$GITHUB_SHA"
          --timeout 15
          --retries 2

      - name: Check production main Raw URLs
        run: >
          python scripts/check_upstreams.py
          --local-only
          --config-ref main
          --timeout 15
          --retries 2

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surge-rule-validation
          path: validation-report.json
          if-no-files-found: ignore
