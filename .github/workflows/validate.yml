name: Validate Surge rules

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check expanded rule is current
        run: python scripts/build_expanded.py --check

      - name: Validate repository
        run: >
          python scripts/validate.py
          --strict
          --github-annotations
          --json-out validation-report.json

      - name: Check generated Adblock supplement
        run: >
          python scripts/sync_adblock4limbo.py
          --check
          --timeout 30

      - name: Check BiliUniverse Global compatibility
        run: >
          python scripts/check_biliuniverse.py
          --timeout 30

      - name: Check retained-module compatibility contract
        run: python scripts/check_module_compatibility.py

      - name: Check local files and external upstreams
        run: >
          python scripts/check_upstreams.py
          --timeout 15
          --retries 2

      - name: Check current commit Raw URLs
        run: >
          python scripts/check_upstreams.py
          --local-only
          --local-ref "$GITHUB_SHA"
          --timeout 15
          --retries 2

      - name: Check production main Raw URLs
        run: >
          python scripts/check_upstreams.py
          --local-only
          --config-ref main
          --timeout 15
          --retries 2

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: surge-rule-validation
          path: validation-report.json
          if-no-files-found: ignore
