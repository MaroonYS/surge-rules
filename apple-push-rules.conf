# Apple Push Notification service TCP 5223 rules
# Policy is supplied by the outer RULE-SET declaration in surge-main.conf.
# The five IPv4 ranges and four IPv6 ranges are Apple's narrow allow-list.
# Apple also recommends allowing all of 17.0.0.0/8; the final IPv4 fallback
# remains constrained to APNs TCP 5223 and covers future load-balancer changes.
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.249.0.0/16,no-resolve))
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.252.0.0/16,no-resolve))
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.57.144.0/22,no-resolve))
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.188.128.0/18,no-resolve))
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.188.20.0/23,no-resolve))
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.0.0.0/8,no-resolve))
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR6,2620:149:a44::/48,no-resolve))
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR6,2403:300:a42::/48,no-resolve))
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR6,2403:300:a51::/48,no-resolve))
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR6,2a01:b740:a42::/48,no-resolve))
