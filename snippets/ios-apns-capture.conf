# APNs-capture mode. Merge these keys into the existing [General] section;
# do not add a second section. Do not combine this with ios-continuity.conf.
# include-apns requires include-all-networks. Surge warns that include-all-networks
# can affect AirDrop/Continuity on some iOS versions even when LAN capture is off.
include-all-networks = true
include-local-networks = false
include-apns = true
include-cellular-services = false
