# Merge these keys into the existing [General] section; do not add a second section.
# include-apns requires include-all-networks. Keep LAN and carrier-service capture
# disabled so Handoff, AirDrop, Wi-Fi Calling, MMS and Visual Voicemail stay local.
include-all-networks = true
include-local-networks = false
include-apns = true
include-cellular-services = false
