# Paste these lines inside the existing [Proxy Group] section.
# Voice page/control uses the stable account path; call media defaults DIRECT.
GoogleVoice-Control = select, Res-Frontier, "United States"
GoogleVoice-Media = select, DIRECT, "United States"
# Private Relay must use a UDP/QUIC-capable ordinary node; the residential
# SOCKS5 policies are intentionally excluded because they do not relay UDP.
Private = select, "United States", "Hong Kong", Singapore, DIRECT
# APNs uses a long-lived TCP 5223 connection. Keep one verified path fixed:
# HTTP fallback/url-test probes do not prove that a proxy supports TCP 5223.
Apple-Push = select, "United States", "Hong Kong", DIRECT
# Bybit is fail-closed by default. Add only the policy matching the account
# holder's actual supported jurisdiction; do not reuse the broad Crypto group.
Bybit = select, REJECT, DIRECT
