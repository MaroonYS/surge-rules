# Paste these lines inside the existing [Proxy Group] section.
# GoogleVoice must resolve to one fixed proxy with working UDP relay.
GoogleVoice = select, "United States"
# APNs uses a long-lived TCP connection. Prefer Hong Kong, fail over to the
# United States, and retain DIRECT only as the last-resort path for all pushes.
Apple-Push = fallback, "Hong Kong", "United States", DIRECT, interval=600, timeout=5
