# Work around NSRingo/WeatherKit country inference without modifying the module.
# A *-US locale can still carry a China coordinate. Only in that combination,
# and only when country is absent, identify the request as CN so Weather.Replace
# can run; the module's separately selected AQ calculation algorithm is untouched.
[URL Rewrite]
^https:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/([^\/]*-US)\/((?:1[89]|[2-4][0-9]|5[0-3])(?:\.[0-9]+)?)\/((?:7[3-9]|[89][0-9]|1[01][0-9]|12[0-9]|13[0-4])(?:\.[0-9]+)?)\?(?!country=|[^#]*&country=)([^#]*)$ https://weatherkit.apple.com/api/v2/weather/$1/$2/$3?$4&country=CN header
