# Work around NSRingo/WeatherKit#100 without modifying the retained module.
# The user's fixed WLOC is 22.544577,113.94114; only fill country for that
# coordinate prefix when iPhone/watchOS omits the query parameter.
[URL Rewrite]
^https:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/([^\/]+)\/(22\.54[0-9]*)\/(113\.94[0-9]*)\?(?!country=|[^#]*&country=)([^#]*)$ https://weatherkit.apple.com/api/v2/weather/$1/$2/$3?$4&country=CN header
