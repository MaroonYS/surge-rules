# Work around NSRingo/WeatherKit country inference without modifying the module.
# A *-US locale can still carry a China coordinate. The broad rule additionally
# requires Asia/Shanghai; the narrow Shenzhen fallback covers requests that omit
# timezone. Both require country to be absent. The selected AQ algorithm is untouched.
[URL Rewrite]
^https:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/([A-Za-z0-9]+(?:-[A-Za-z0-9]+)*-US)\/((?:1[89]|[2-4][0-9]|5[0-3])(?:\.[0-9]+)?)\/((?:7[3-9]|[89][0-9]|1[01][0-9]|12[0-9]|13[0-4])(?:\.[0-9]+)?)\?(?!country=|[^#]*&country=)(?=(?:[^#]*&)?timezone=Asia(?:%2[Ff]|\/)Shanghai(?:&|$))([^#]+)$ https://weatherkit.apple.com/api/v2/weather/$1/$2/$3?$4&country=CN header
^https:\/\/weatherkit\.apple\.com\/api\/v2\/weather\/([A-Za-z0-9]+(?:-[A-Za-z0-9]+)*-US)\/(22\.(?:[4-9][0-9]*))\/((?:113\.(?:[5-9][0-9]*)|114\.(?:[0-7][0-9]*)))\?(?!country=|[^#]*&country=)([^#]*)$ https://weatherkit.apple.com/api/v2/weather/$1/$2/$3?$4&country=CN header
