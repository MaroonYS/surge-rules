[Rule]

# 1. 协议和局域网
# NTP 不支持通用代理；避免 Apple/系统时间同步误入节点后长时超时
DEST-PORT,123,DIRECT
# X 第一方账户、API、Money、媒体与 Live 全部固定住宅出口
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/x-residential.conf,Res-Frontier,extended-matching
# Google 账户登录、管理与 OAuth 控制面先固定住宅出口
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/google-account.conf,Res-Frontier,extended-matching
# Google Voice 控制面固定美国住宅；精确媒体例外 DIRECT，其余 STUN 继续拒绝
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/google-voice.conf,Res-Frontier,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/google-voice-media.conf,DIRECT,extended-matching
RULE-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/google-voice-media-rules.conf,DIRECT
# ChatGPT Voice 官方精确媒体 IP 先于全局 STUN 拒绝
RULE-SET,https://ruleset.skk.moe/List/ip/ai.conf,"United States"
PROTOCOL,STUN,REJECT
PROTOCOL,MTProto,Singapore
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,Singapore
RULE-SET,https://ruleset.skk.moe/List/non_ip/lan.conf,DIRECT
RULE-SET,LAN,DIRECT,no-resolve

# 2. 必须最优先匹配的特殊服务
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/bilibili-direct.conf,DIRECT,extended-matching
# 恢复被共享 Reject 命中的淘宝/天猫品牌互动小程序运行时
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/taobao-functional.conf,DIRECT,extended-matching
# Polymarket 国际产品固定香港上下文（须与真实资格一致）；美国独立产品才固定住宅出口
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/polymarket-global.conf,"Hong Kong",extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/polymarket.conf,Res-Frontier,extended-matching

# 3. iCloud Private Relay
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/icloud_private_relay.conf,"United States",extended-matching

# 4. Apple Intelligence / Siri / PCC
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/apple-ai.conf,"United States",extended-matching

# 5. 中国大陆银行
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/direct-cn.conf,DIRECT,extended-matching

# 6. 分地区金融
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/hk-finance.conf,"Hong Kong",extended-matching
# 当前账户使用的 HSBC HK、Futu/Moomoo HK 与 Longbridge HK 共享基础设施
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/hk-finance-context.conf,"Hong Kong",extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/sg-finance.conf,Singapore,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/jp-finance.conf,Japan,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/kr-finance.conf,Korea,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/uk-finance.conf,"United Kingdom",extended-matching

# 7. 美国住宅出口
# Apple Account / App Store 账单动态分片，与 PayPal 保持同一住宅出口
RULE-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/apple-account-payment-rules.conf,Res-Frontier
# 包括 Apple Cash、Apple Pay、美国银行、信用局、券商、PayPal、美国支付
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/us-residential.conf,Res-Frontier,extended-matching

# 8. 跨地区金融、身份与风控
# 跨地区第一方金融与支付
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/finance-context.conf,Res-Frontier,extended-matching
# 无法从共享多租户域名识别调用方的身份验证与 KYC，固定美国住宅兜底
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/identity-context.conf,Res-Frontier,extended-matching
# 无法从共享多租户域名识别调用方的设备指纹与反欺诈，固定美国住宅兜底
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/risk-context.conf,Res-Frontier,extended-matching

# 9. 中心化交易所
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/bybit.conf,Bybit,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/crypto.conf,Crypto,extended-matching

# 10. 钱包、RPC、DeFi、NFT、区块浏览器
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/web3.conf,Web3,extended-matching

# 11. Apple Push 与剩余系统服务
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/apple-push.conf,"United States",extended-matching
# APNs 设备端长连接：Apple 公开窄网段及官方建议 17/8 均限定为 TCP 5223
RULE-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/apple-push-rules.conf,"United States"
RULE-SET,SYSTEM,DIRECT

# 12. 广告和恶意域名
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/adblock4limbo-supplement.conf,REJECT,extended-matching
