[Rule]

# 1. Protocol and LAN
# STUN is intentionally not rejected globally: WebRTC, FaceTime and video verification may require it.
PROTOCOL,MTProto,Telegram
RULE-SET,LAN,DIRECT,no-resolve

# 2. High-priority service exceptions
DOMAIN-KEYWORD,polymarket,Res-Frontier,extended-matching

# 3. iCloud Private Relay
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/icloud_private_relay.conf,Private-Relay,extended-matching

# 4. Apple Intelligence / Siri / Private Cloud Compute
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/apple-ai.conf,Apple-AI,extended-matching

# 5. Apple Cash / Apple Pay stay with the Apple system path
DOMAIN-SUFFIX,applecash.apple.com,DIRECT,extended-matching
DOMAIN-SUFFIX,applepay.apple.com,DIRECT,extended-matching
DOMAIN,apple-pay-gateway.apple.com,DIRECT,extended-matching

# 6. Mainland China and regional finance
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/direct-cn.conf,DIRECT,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/hk-finance.conf,HK-FINANCE,extended-matching
