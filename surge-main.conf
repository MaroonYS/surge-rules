# 10. 钱包、RPC、DeFi、NFT、区块浏览器
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/web3.conf,Web3,extended-matching

# 11. Apple Push 与剩余系统服务
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/apple-push.conf,Apple-Push,extended-matching
# APNs 设备端长连接：仅接管 Apple 公开网段上的 TCP 5223，避免扩大到整个 17/8
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.249.0.0/16,no-resolve)),Apple-Push
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.252.0.0/16,no-resolve)),Apple-Push
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.57.144.0/22,no-resolve)),Apple-Push
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.188.128.0/18,no-resolve)),Apple-Push
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR,17.188.20.0/23,no-resolve)),Apple-Push
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR6,2620:149:a44::/48,no-resolve)),Apple-Push
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR6,2403:300:a42::/48,no-resolve)),Apple-Push
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR6,2403:300:a51::/48,no-resolve)),Apple-Push
AND,((PROTOCOL,TCP),(DEST-PORT,5223),(IP-CIDR6,2a01:b740:a42::/48,no-resolve)),Apple-Push
RULE-SET,SYSTEM,DIRECT

