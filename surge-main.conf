[Rule]

# 1. 本机协议与局域网
# 不全局拒绝 STUN：WebRTC、FaceTime、视频验证可能依赖它。
PROTOCOL,MTProto,Telegram
RULE-SET,LAN,DIRECT,no-resolve

# 2. iCloud Private Relay
# 六条已知端点作为本地精确兜底；远程集负责跟进新增端点。
DOMAIN,mask.icloud.com,Private-Relay,extended-matching
DOMAIN,mask-h2.icloud.com,Private-Relay,extended-matching
DOMAIN,mask.apple-dns.net,Private-Relay,extended-matching
DOMAIN,mask-api.icloud.com,Private-Relay,extended-matching
DOMAIN,mask-canary.icloud.com,Private-Relay,extended-matching
DOMAIN,canary.mask.apple-dns.net,Private-Relay,extended-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/icloud_private_relay.conf,Private-Relay,extended-matching

# 3. Apple Intelligence / Siri / Private Cloud Compute
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/apple-ai.conf,Apple-AI,extended-matching

# 4. Apple Cash / Apple Pay 保持系统路径
DOMAIN-SUFFIX,applecash.apple.com,DIRECT,extended-matching
DOMAIN-SUFFIX,applepay.apple.com,DIRECT,extended-matching
DOMAIN,apple-pay-gateway.apple.com,DIRECT,extended-matching

# 5. 中国大陆及分地区金融
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/direct-cn.conf,DIRECT,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/hk-finance.conf,HK-FINANCE,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/sg-finance.conf,SG-FINANCE,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/jp-finance.conf,JP-FINANCE,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/kr-finance.conf,KR-FINANCE,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/uk-finance.conf,UK-FINANCE,extended-matching

# 6. 美国及跨地区金融
# Polymarket 只使用 .com / .us 与一个 Auth0 精确主机，不再使用 DOMAIN-KEYWORD。
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/us-residential.conf,Res-Frontier,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/finance-context.conf,Finance,extended-matching

# 7. Crypto 与 Web3
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/crypto.conf,Crypto,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/web3.conf,Web3,extended-matching

# 8. 剩余系统服务
RULE-SET,SYSTEM,DIRECT

# 9. 服务专用规则优先于广告规则，避免必要资源被大型拒绝列表抢先命中
RULE-SET,https://github.com/ddgksf2013/Filter/raw/master/Emby.list,Emby,extended-matching
# 当前源配置只提供了关键词 cr18；这是唯一保留的 DOMAIN-KEYWORD。
DOMAIN-KEYWORD,cr18,Singapore,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/telegram.conf,Telegram,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/ai.conf,AIGC,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream_us.conf,Streaming,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/stream.conf,Streaming,extended-matching

# 10. Apple 与 Microsoft
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cdn.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft_cdn.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_cn.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/apple_services.conf,Apple,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/microsoft.conf,Microsoft,extended-matching

# 11. 下载、更新、测速与静态 CDN
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/speedtest.conf,PROXY,extended-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/download.conf,Download,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/download.conf,Download,extended-matching
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/cdn.conf,PROXY,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/cdn.conf,PROXY,extended-matching

# 12. 广告、隐私与恶意域名
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/reject.conf,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject.conf,REJECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-no-drop.conf,REJECT-NO-DROP,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/reject-drop.conf,REJECT-DROP,extended-matching
RULE-SET,https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/Adblock4limbo_surge.list,REJECT

# 13. 国内与海外基础规则：明确服务优先，通用规则靠后
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/direct.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/domestic.conf,DIRECT,extended-matching
RULE-SET,https://ruleset.skk.moe/List/non_ip/global.conf,PROXY,extended-matching

# 14. IP 规则全部 no-resolve；明确服务先于通用拒绝
RULE-SET,https://ruleset.skk.moe/List/ip/telegram.conf,Telegram,no-resolve
RULE-SET,https://ruleset.skk.moe/List/ip/stream_us.conf,Streaming,no-resolve
RULE-SET,https://ruleset.skk.moe/List/ip/stream.conf,Streaming,no-resolve
RULE-SET,https://ruleset.skk.moe/List/ip/reject.conf,REJECT-DROP,no-resolve
RULE-SET,https://ruleset.skk.moe/List/ip/domestic.conf,DIRECT,no-resolve
RULE-SET,https://ruleset.skk.moe/List/ip/china_ip.conf,DIRECT,no-resolve

FINAL,PROXY,dns-failed
