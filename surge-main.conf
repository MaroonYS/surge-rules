[Rule]

# 1. 协议和局域网
# Google Voice 页面/呼叫控制走稳定节点；STUN/媒体可独立选择 DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/google-voice.conf,GoogleVoice-Control,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/google-voice-media.conf,GoogleVoice-Media,extended-matching
AND,((PROTOCOL,UDP),(DEST-PORT,19302-19309),(IP-CIDR,74.125.39.0/24,no-resolve)),GoogleVoice-Media
AND,((PROTOCOL,UDP),(DEST-PORT,26500-26501),(IP-CIDR,74.125.39.0/24,no-resolve)),GoogleVoice-Media
AND,((PROTOCOL,UDP),(DEST-PORT,19302),(IP-CIDR,74.125.250.129/32,no-resolve)),GoogleVoice-Media
AND,((PROTOCOL,UDP),(DEST-PORT,19302-19309),(IP-CIDR6,2001:4860:4864:2::/64,no-resolve)),GoogleVoice-Media
AND,((PROTOCOL,UDP),(DEST-PORT,26500-26501),(IP-CIDR6,2001:4860:4864:2::/64,no-resolve)),GoogleVoice-Media
PROTOCOL,STUN,REJECT
PROTOCOL,MTProto,Telegram
RULE-SET,https://ruleset.skk.moe/List/non_ip/lan.conf,DIRECT
RULE-SET,LAN,DIRECT,no-resolve

# 2. 必须最优先匹配的特殊服务
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/bilibili-direct.conf,DIRECT,extended-matching
# 恢复被共享 Reject 命中的淘宝/天猫品牌互动小程序运行时
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/taobao-functional.conf,DIRECT,extended-matching
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/polymarket.conf,Res-Frontier,extended-matching

# 3. iCloud Private Relay
DOMAIN-SET,https://ruleset.skk.moe/List/domainset/icloud_private_relay.conf,Apple,extended-matching

# 4. Apple Intelligence / Siri / PCC
DOMAIN-SET,https://raw.githubusercontent.com/MaroonYS/surge-rules/main/apple-ai.conf,AIGC,extended-matching

